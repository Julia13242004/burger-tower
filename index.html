<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3d9">
  <meta name="description" content="Лови ингредиенты одним касанием и собери самый высокий бургер.">
  <title>Бургер-башня</title>
  <link rel="icon" href="assets/bun-up.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="masthead">
      <h1>Бургер-башня</h1>
      <div class="scores" aria-label="Счёт">
        <div class="score">
          <span>Высота</span>
          <strong id="height">0,05 м</strong>
        </div>
        <div class="score score-best">
          <span>Рекорд</span>
          <strong id="best">—</strong>
        </div>
      </div>
    </header>

    <section class="stage" aria-label="Игровое поле">
      <div class="tiles" aria-hidden="true"></div>
      <div class="awning" aria-hidden="true"></div>
      <div class="counter" aria-hidden="true"></div>
      <canvas id="board" aria-hidden="true"></canvas>
      <button class="playfield" id="playfield" type="button" aria-label="Положить слой" disabled></button>
      <div class="welcome" id="welcome">
        <span class="welcome-title">Поймай момент!</span>
        <p>Коснись экрана, когда слой окажется над башней.</p>
      </div>
      <div class="ingredient" id="ingredient" hidden></div>
    </section>

    <footer class="controls">
      <p class="caption" id="caption" role="status">Каждый слой добавляет 5 см</p>
      <button class="action" id="action" type="button" disabled>Загрузка…</button>
    </footer>
  </main>
  <noscript>Включи JavaScript в браузере, чтобы сыграть.</noscript>
</body>
</html>
