<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3d9">
  <meta name="description" content="Лови ингредиенты одним касанием и собери самый высокий бургер.">
  <title>Chef Burger</title>
  <link rel="icon" href="assets/bun-up.png?v=2" type="image/png">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="game.js?v=4" defer></script>
</head>
<body>
  <main class="game">
    <header class="masthead">
      <h1>Chef Burger</h1>
      <div class="scores" aria-label="Счёт">
        <div class="score">
          <span>Высота</span>
          <strong id="height">0,05 м</strong>
        </div>
        <div class="score score-best">
          <span>Рекорд</span>
          <strong id="best">—</strong>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Игровое поле">
      <div class="tiles" aria-hidden="true"></div>
      <div class="awning" aria-hidden="true"></div>
      <div class="counter" aria-hidden="true"></div>
      <canvas id="board" aria-hidden="true"></canvas>
      <img class="result-animation" id="resultAnimation" width="415" height="462" alt="Кот с пушистым хвостом крадёт бургер" hidden>
      <button class="playfield" id="playfield" type="button" aria-label="Положить слой" disabled></button>
      <div class="welcome" id="welcome">
        <span class="welcome-title">Поймай момент!</span>
        <p>Коснись экрана, когда слой окажется над башней. Старайся держать её ровно.</p>
      </div>
      <div class="ingredient" id="ingredient" hidden></div>
    </section>

    <footer class="controls">
      <p class="caption" id="caption" role="status">Собери бургер высотой 10 м и получи подарок</p>
      <button class="action" id="action" type="button" disabled>Загрузка…</button>
    </footer>
  </main>
  <dialog class="gift" id="gift" aria-labelledby="gift-title">
    <img class="gift-image" src="assets/gift.png" alt="" width="112" height="112">
    <h2 id="gift-title">Подарок за 10 метров!</h2>
    <p><strong>Книга «Азбука вкуса»</strong><br>Карен Пейдж и Эндрю Дорненбург</p>
    <form method="dialog">
      <button class="action" type="submit" autofocus>Продолжить игру</button>
    </form>
  </dialog>
  <noscript>Включи JavaScript в браузере, чтобы сыграть.</noscript>
</body>
</html>
